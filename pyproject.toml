[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "nano-claude-code-py"
version = "0.1.0"
description = "An unofficial minimal terminal coding agent in Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "GZL11" }
]
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pydantic>=2.7.1",
  "pydantic-settings>=2.2.1",
  "anthropic>=0.49.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.1",
  "ruff>=0.4.0"
]

[project.scripts]
nano-claude = "nano_claude_code_py.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nano_claude_code_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
